# GKE HTTPS Ingress with Google-managed TLS certificate.
#
# Prerequisites (handled by deploy.sh):
#   1. A global static IP is reserved:
#        gcloud compute addresses create gemini-live-ip --global
#   2. Your domain's A record points to that static IP.
#   3. deploy.sh substitutes REPLACE_WITH_DOMAIN and REPLACE_WITH_STATIC_IP_NAME.
#
# After deployment, Google-managed certificate provisioning takes 15–60 min
# once the DNS A record has propagated.
# Monitor: kubectl describe managedcertificate gemini-live-cert -n gemini-live
#
# BackendConfig (in service.yaml) sets the 3600 s backend timeout, which is
# required for long-running voice calls.

---
# Google-managed TLS certificate — auto-provisioned and auto-renewed.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: gemini-live-cert
  namespace: gemini-live
spec:
  domains:
    - REPLACE_WITH_DOMAIN

---
# FrontendConfig: redirect plain HTTP (port 80) → HTTPS.
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: gemini-live-frontend-config
  namespace: gemini-live
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT

---
# Ingress — creates a GCP HTTP(S) Global Load Balancer.
# All traffic (including WebSocket upgrades) routes to gemini-live-backend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gemini-live-ingress
  namespace: gemini-live
  annotations:
    kubernetes.io/ingress.global-static-ip-name: "REPLACE_WITH_STATIC_IP_NAME"
    networking.gke.io/managed-certificates: "gemini-live-cert"
    networking.gke.io/v1beta1.FrontendConfig: "gemini-live-frontend-config"
spec:
  defaultBackend:
    service:
      name: gemini-live-backend
      port:
        number: 80
