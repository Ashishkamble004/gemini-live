# Service for the Gemini Live backend.
#
# type: NodePort — traffic arrives via the GKE Gateway (gateway.yaml),
# which terminates TLS and forwards to this Service over HTTP.
#
# sessionAffinity: ClientIP — kept for direct Service access (e.g. kubectl
# port-forward). For Gateway-routed traffic, session affinity is enforced
# at the load balancer level by GCPBackendPolicy in gateway.yaml.
#
# Note: the BackendConfig + cloud.google.com/backend-config annotation
# previously used with the Ingress have been replaced by GCPBackendPolicy
# in gateway.yaml; the cloud.google.com/neg annotation for Ingress NEGs
# is no longer needed since the Gateway controller creates NEGs automatically.
apiVersion: v1
kind: Service
metadata:
  name: gemini-live-backend
  namespace: gemini-live
  labels:
    app: gemini-live-backend
spec:
  type: NodePort
  selector:
    app: gemini-live-backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  # Pin requests from the same caller IP to the same pod for the duration of
  # a call. Effective for direct Service access; for Gateway-routed traffic,
  # GCPBackendPolicy (gateway.yaml) handles this at the LB level.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      # 3600 s matches the maximum supported call duration.
      timeoutSeconds: 3600
