# Service for the Gemini Live backend.
#
# type: NodePort — traffic arrives via the GKE HTTP(S) Ingress (ingress.yaml),
# which terminates TLS and forwards to this service over HTTP.
#
# Annotations:
#   backend-config  — tells the HTTP(S) LB to use the 3600 s timeout defined in
#                     BackendConfig (effective because this service is Ingress-backed).
#   neg             — enables container-native load balancing; the LB routes
#                     directly to pod IPs instead of going through kube-proxy.
apiVersion: v1
kind: Service
metadata:
  name: gemini-live-backend
  namespace: gemini-live
  labels:
    app: gemini-live-backend
  annotations:
    cloud.google.com/backend-config: '{"default": "gemini-live-backendconfig"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: NodePort
  selector:
    app: gemini-live-backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
# BackendConfig — sets the HTTP timeout to 3600 s so long calls are not
# dropped by the GCP load balancer. Effective when referenced by an
# Ingress-backed Service (which this service now is).
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: gemini-live-backendconfig
  namespace: gemini-live
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 600
