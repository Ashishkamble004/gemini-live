apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemini-live-backend
  namespace: gemini-live
  labels:
    app: gemini-live-backend
spec:
  selector:
    matchLabels:
      app: gemini-live-backend
  template:
    metadata:
      labels:
        app: gemini-live-backend
    spec:
      serviceAccountName: gemini-live-sa

      # Graceful shutdown: allow in-flight calls to finish (max 10 min)
      terminationGracePeriodSeconds: 600

      containers:
        - name: backend
          # Image is updated by cloudbuild.yaml on every push.
          # Replace YOUR_PROJECT_ID with your actual GCP project ID.
          image: gcr.io/YOUR_PROJECT_ID/geminilive-glive:latest
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Load non-secret config from ConfigMap
          envFrom:
            - configMapRef:
                name: gemini-live-config

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

---
# Optional: auto-scale based on CPU usage
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gemini-live-backend-hpa
  namespace: gemini-live
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gemini-live-backend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
