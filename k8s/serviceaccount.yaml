# Kubernetes ServiceAccount bound to a Google Service Account via
# Workload Identity. This lets the Pod authenticate to GCP APIs
# (Vertex AI, Cloud Storage) without key files.
#
# Pre-requisites (handled by deploy.sh):
#   1. GCP Service Account created:
#        gcloud iam service-accounts create gemini-live-backend \
#          --project=YOUR_PROJECT_ID
#
#   2. IAM roles granted:
#        roles/aiplatform.user
#        roles/storage.objectAdmin
#
#   3. Workload Identity binding:
#        gcloud iam service-accounts add-iam-policy-binding \
#          gemini-live-backend@YOUR_PROJECT_ID.iam.gserviceaccount.com \
#          --role=roles/iam.workloadIdentityUser \
#          --member="serviceAccount:YOUR_PROJECT_ID.svc.id.goog[gemini-live/gemini-live-sa]"
#
#   4. GKE Autopilot has Workload Identity enabled by default.
#      For Standard clusters, enable it with:
#        gcloud container clusters update YOUR_CLUSTER \
#          --workload-pool=YOUR_PROJECT_ID.svc.id.goog \
#          --region=us-central1
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gemini-live-sa
  namespace: gemini-live
  annotations:
    # Replace YOUR_PROJECT_ID with your actual GCP project ID.
    # deploy.sh substitutes this automatically.
    iam.gke.io/gcp-service-account: gemini-live-backend@YOUR_PROJECT_ID.iam.gserviceaccount.com
