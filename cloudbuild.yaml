# Cloud Build — build backend image and deploy to GKE via rolling update
#
# Required substitution variables:
#   _CLUSTER_NAME : GKE cluster name  (e.g. gemini-live-cluster)
#   _REGION       : GKE cluster region (e.g. us-central1)
#
# Set in the Cloud Build trigger UI or pass with:
#   gcloud builds submit \
#     --config cloudbuild.yaml \
#     --substitutions _CLUSTER_NAME=gemini-live-cluster,_REGION=us-central1 .
#
# Cloud Build SA needs (granted by deploy.sh):
#   roles/container.developer    — update GKE workloads
#   roles/storage.admin          — push images to GCR
#   roles/iam.serviceAccountUser — deploy as the backend service account

substitutions:
  _CLUSTER_NAME: gemini-live-cluster
  _REGION: us-central1
  _IMAGE: gcr.io/$PROJECT_ID/geminilive-glive
  _TAG: latest

steps:
  # ── 1. Build the backend container image ────────────────────────────────────
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_IMAGE:$_TAG
      - -t
      - $_IMAGE:latest
      - ./backend

  # ── 2. Push to Container Registry ───────────────────────────────────────────
  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_IMAGE
    waitFor: [build-image]

  # ── 3. Rolling update on GKE ─────────────────────────────────────────────────
  # Gets cluster credentials and updates the container image in-place.
  # Kubernetes performs a rolling update: new pods are started before old ones
  # are terminated, ensuring zero-downtime deployments.
  # Requires roles/container.developer on the Cloud Build SA.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - '-c'
      - |
        # Install kubectl and gke-gcloud-auth-plugin if not present.
        # gke-gcloud-auth-plugin is required for kubectl to authenticate to GKE
        # clusters (mandatory since kubectl 1.26 / gcloud 408.0.0).
        gcloud components install kubectl gke-gcloud-auth-plugin --quiet 2>/dev/null || true
        export USE_GKE_GCLOUD_AUTH_PLUGIN=True

        # Authenticate to the cluster
        gcloud container clusters get-credentials "$_CLUSTER_NAME" \
          --region="$_REGION" \
          --project="$PROJECT_ID"

        # Patch the deployment's container image — triggers a rolling update
        kubectl set image deployment/gemini-live-backend \
          backend="$_IMAGE:$_TAG" \
          --namespace=gemini-live

        # Wait for the rollout to finish (fail the build if it doesn't)
        kubectl rollout status deployment/gemini-live-backend \
          --namespace=gemini-live \
          --timeout=300s
    waitFor: [push-image]

images:
  - $_IMAGE:$_TAG
  - $_IMAGE:latest

timeout: '1800s'

options:
  logging: CLOUD_LOGGING_ONLY
